[project]
name = "haron-backend"
version = "0.1.0"
description = "AI Home Design Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "arq>=0.26.0",
    "redis[hiredis]>=5.0.8",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "shapely>=2.0.5",
    "geoalchemy2>=0.15.2",
    "pgvector>=0.3.2",
    "asgi-correlation-id>=4.3.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "ruff>=0.6.2",
    "mypy>=1.11.1",
    "types-redis>=4.6.0.20240425",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F841"]
"alembic/*" = ["E402", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "eval: assistant evaluation suite",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["shapely.*", "geoalchemy2.*", "pgvector.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
